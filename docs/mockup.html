<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iSTOCK — ระบบสต็อกวัสดุอุปกรณ์ งานกายภาพและสิ่งแวดล้อม ศูนย์กีฬาสิรินธร มศว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --neutral-50:#F7F7F7; --neutral-100:#EDEDED; --neutral-200:#D9D9D9; --neutral-300:#BDBDBD; --neutral-400:#8F8F8F; --neutral-600:#616161; --neutral-700:#4D4D4D; --neutral-800:#383838; --neutral-900:#262626; --neutral-950:#171717; --brand-50:#F4F4F4; --brand-100:#E8E8E8; --brand-200:#D2D2D2; --brand-500:#7A7A7A; --brand-600:#4D4D4D; --brand-700:#383838; --brand-800:#262626; --red-50:#FFF4F3; --red-100:#FFE4E1; --red-600:#BC1723; --red-700:#9D0517; --red-800:#800311; --green-50:#F0FAF6; --green-600:#00CE7C; --green-800:#009157; --green-900:#006E42; --teal-100:#EAF7F8; --teal-200:#D2EFEF; --teal-800:#5F9294; --teal-900:#497072; --blue-50:#E8F0FC; --blue-100:#D1E1F9; --blue-600:#1E60D0; --blue-800:#143F85; --yellow-50:#FFFBF0; --yellow-100:#FFF7D6; --yellow-400:#FFDB5C; --yellow-600:#FFD340; --yellow-950:#66551A;
    --swu-50:#FDF1F2; --swu-100:#F9DEE0; --swu-200:#F0B8BD; --swu-600:#B3121C; --swu-700:#930E17; --swu-800:#750B12;
    --font-thai:"Noto Sans Thai", sans-serif;
    --focus-ring: rgba(179,18,28,.20);
    --focus-ring-red: rgba(188,23,35,.18);
    --r-sm:4px; --r-md:8px; --r-lg:14px; --r-xl:18px; --r-2xl:24px; --r-pill:999px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
    --shadow-lg:0 8px 24px rgba(23,23,23,.08);
    --shadow-xl:0 16px 40px rgba(23,23,23,.10);
    --bg: #fff; --card:#fff; --line: var(--neutral-100); --text: var(--neutral-900); --muted: var(--neutral-600);
    --brand: var(--brand-600); --brand-2: var(--brand-50); --accent: var(--swu-600);
    --in:var(--neutral-600); --in-bar:var(--neutral-300); --in-line:var(--brand-500); --out-line:var(--brand-700); --green: var(--green-800); --blue: var(--blue-600); --red: var(--red-600); --amber: var(--yellow-600);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-thai);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .wrap{width:100%;max-width:1100px;margin:0 auto;padding:16px}
  .muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px} .b{font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .gap>*+*{margin-top:12px}
  h2{font-size:20px;font-weight:700} h3{font-size:15px;font-weight:700}
  svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .dev{background:var(--yellow-50);color:var(--yellow-950);font-size:12px;text-align:center;padding:7px 10px;border-bottom:1px solid var(--yellow-100)}

  .top{background:#fff;border-top:4px solid var(--accent);border-bottom:1px solid var(--neutral-200);position:sticky;top:0;z-index:10;color:var(--neutral-900)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:12px}
  .logo{display:flex;align-items:center;gap:10px;min-width:0}
  .logo b{display:block;font-size:17px;line-height:1.2}
  .logo span{color:var(--muted);font-size:12px}
  .actions{display:flex;gap:6px;align-items:center}
  .top .btn.sm.ghost{background:var(--neutral-50);border-color:var(--neutral-200);color:var(--neutral-700)}
  .top .btn.sm.ghost:hover{background:var(--swu-50);border-color:var(--swu-200);color:var(--swu-700)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 var(--s4);border-radius:var(--r-md);font-weight:700;font-size:14px;background:#fff;border:1px solid var(--brand-600);color:var(--brand-600);transition:150ms cubic-bezier(.2,.7,.2,1)}
  .btn:hover{background:var(--brand-50);border-color:var(--brand-700);color:var(--brand-700)}
  .btn:active{background:var(--brand-100);border-color:var(--brand-800);color:var(--brand-800)}
  .btn:disabled{background:var(--neutral-50);border-color:var(--neutral-200);color:var(--neutral-300);pointer-events:none}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring)}
  .btn.primary{background:var(--swu-600);border-color:var(--swu-600);color:#fff}
  .btn.primary:hover{background:var(--swu-700);border-color:var(--swu-700);color:#fff}
  .btn.primary:active{background:var(--swu-800);border-color:var(--swu-800);color:#fff}
  .btn.primary:disabled{background:var(--neutral-50);border-color:var(--neutral-200);color:var(--neutral-300)}
  .btn.danger{background:var(--red-600);border-color:var(--red-600);color:var(--neutral-50)}
  .btn.danger:hover{background:var(--red-700);border-color:var(--red-700)}
  .btn.ghost{background:var(--brand-50);border-color:transparent;color:var(--brand-600)}
  .btn.ghost:hover{background:var(--brand-100);color:var(--brand-700)}
  .btn.ghost.danger{background:var(--red-50);color:var(--red-700)}
  .btn.ghost.danger:hover{background:var(--red-100)}
  .btn{white-space:nowrap}
  .btn.sm{height:32px;padding:0 var(--s3);font-size:12px;border-radius:var(--r-sm)}
  .btn.block{width:100%}
  .tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .tbar input{flex:2 1 240px;min-width:0}
  .tbar select{flex:1 1 220px;min-width:0;max-width:360px}
  .tbar .acts{display:flex;gap:8px;margin-left:auto}
  .dbar .tabs{flex:none;min-width:220px}
  .dbar select{flex:1 1 260px;max-width:none}
  .dbar .pnav{margin-left:auto;flex-wrap:nowrap}
  .dbar .pnav .btn:not(.ghost){width:40px;padding:0}
  @media(max-width:640px){.dbar .tabs{flex:1 1 100%}.dbar .pnav{margin-left:0;width:100%;justify-content:space-between}.tbar select{max-width:none}.tbar .acts{margin-left:0;width:100%}.tbar .acts .btn{flex:1}}
  .btn.big{height:52px;font-size:16px}

  .card{background:var(--card);border:1px solid var(--neutral-200);border-radius:var(--r-xl);padding:var(--s4);text-align:left;width:100%;display:block;transition:150ms cubic-bezier(.2,.7,.2,1)}
  button.card{cursor:pointer}
  button.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

  .chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:700;white-space:nowrap}
  .c-gray{background:var(--neutral-100);color:var(--neutral-900)}
  .c-blue{background:var(--blue-50);color:var(--blue-800)}
  .c-violet{background:var(--teal-100);color:var(--teal-900)}
  .c-green{background:var(--green-50);color:var(--green-900)}
  .c-red{background:var(--red-50);color:var(--red-800)}
  .c-amber{background:var(--yellow-100);color:var(--yellow-950)}

  .bar{height:6px;background:var(--neutral-100);border-radius:var(--r-pill);overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;background:var(--brand-600);border-radius:var(--r-pill)}
  .bar i.low{background:var(--yellow-600)} .bar i.out{background:var(--red-600)}
  .alert{background:var(--red-50);color:var(--red-700);border-radius:var(--r-md);padding:8px 12px;font-size:13px}
  .note{background:var(--neutral-50);border-radius:var(--r-md);padding:8px 12px}

  .tabs{display:flex;background:var(--neutral-50);border:1px solid var(--neutral-100);border-radius:var(--r-md);padding:3px;overflow-x:auto}
  .tabs button{flex:1;padding:8px 14px;border-radius:var(--r-sm);font-size:14px;font-weight:400;color:var(--muted);white-space:nowrap}
  .tabs button.on{background:#fff;color:var(--swu-700);font-weight:700;box-shadow:0 1px 2px rgba(23,23,23,.06)}

  input[type=text],input[type=password],input[type=number],input[type=date],input[type=tel],textarea,select{width:100%;height:40px;border:1px solid var(--neutral-200);border-radius:var(--r-md);padding:0 var(--s3);background:#fff;outline:none;font-size:14px;transition:150ms cubic-bezier(.2,.7,.2,1)}
  textarea{height:auto;min-height:70px;padding:10px var(--s3);line-height:1.6}
  input::placeholder,textarea::placeholder{color:var(--neutral-400)}
  input:focus,textarea:focus,select:focus{border:1.5px solid var(--accent)}
  label.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
  .f2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .f3{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
  @media(max-width:520px){.f3{grid-template-columns:1fr 1fr}}

  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .ph{position:relative;aspect-ratio:1;border-radius:var(--r-md);overflow:hidden;background:var(--neutral-100);display:block}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .x{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:var(--r-pill);background:rgba(23,23,23,.65);color:var(--neutral-50);display:grid;place-items:center}
  .ph .x svg{width:14px;height:14px}
  .add{border:1.5px dashed var(--neutral-200);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;cursor:pointer;gap:2px;align-content:center}
  .add:hover{border-color:var(--accent);color:var(--accent)}
  .add input{display:none}
  .doc{max-height:260px;width:100%;object-fit:contain;background:var(--neutral-100);border-radius:var(--r-md);display:block}

  .line{border:1px solid var(--neutral-100);border-radius:var(--r-lg);padding:var(--s3);background:#fff}
  .line+.line{margin-top:10px}
  .qty{font-size:28px;font-weight:700;line-height:1.1}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s3)}
  .stat .v{font-size:26px;font-weight:700;line-height:1.2}

  .ov{position:fixed;inset:0;background:rgba(23,23,23,.45);z-index:400;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:var(--r-2xl) var(--r-2xl) 0 0;padding:var(--s5) var(--s6);box-shadow:var(--shadow-xl);padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom));animation:sheetUp .3s cubic-bezier(.2,.8,.2,1)}
  @media(min-width:640px){.ov{align-items:center}.sheet{border-radius:var(--r-2xl)}}
  @keyframes sheetUp{from{opacity:0;transform:translateY(40px)}}
  @media(prefers-reduced-motion:reduce){.sheet{animation:none}}
  .x-close{width:32px;height:32px;border-radius:var(--r-pill);background:var(--neutral-100);color:var(--neutral-600);display:grid;place-items:center;flex:none}
  .ask-ic{width:56px;height:56px;border-radius:var(--r-pill);display:grid;place-items:center;margin:0 auto 12px;background:var(--brand-50);color:var(--brand-600)}
  .ask-ic svg{width:28px;height:28px}
  .ask-ic.warn{background:var(--yellow-100);color:var(--yellow-950)} .ask-ic.danger{background:var(--red-50);color:var(--red-700)}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:600;padding:10px 16px;border-radius:var(--r-md);font-size:14px;font-weight:700;max-width:92vw}
  .toast.ok{background:var(--green-50);color:var(--green-900)} .toast.err{background:var(--red-50);color:var(--red-800)}
  .spin{width:18px;height:18px;border:2px solid var(--swu-100);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .login{max-width:380px;margin:12vh auto 0}
  .login .logo span{color:var(--muted)}
  .hist-ph{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .hist-ph button{width:56px;height:56px;border-radius:var(--r-md);overflow:hidden;background:var(--neutral-100)}
  .hist-ph img{width:100%;height:100%;object-fit:cover;display:block}
  .c-brand{background:var(--brand-100);color:var(--brand-800)}
  .th{width:64px;height:64px;border-radius:var(--r-md);object-fit:cover;background:var(--brand-2);color:var(--brand);display:grid;place-items:center;flex:none}
  .th svg{width:28px;height:28px}
  .th.sm{width:44px;height:44px} .th.sm svg{width:22px;height:22px}
  .th.lg{width:100%;height:200px;border-radius:var(--r-lg)} .th.lg svg{width:56px;height:56px}
  .lgd{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-right:12px}
  .lgd i{width:12px;height:12px;border-radius:var(--r-sm);display:inline-block}
  .chart{display:flex;gap:3px;border-bottom:1px solid var(--neutral-200);margin-top:12px}
  .lgd i.ln{width:18px;height:0;border-radius:0;border-top:2px solid var(--out-line)} .lgd i.ln.in{border-top:2px dashed var(--in-line)}
  .lc{position:relative;display:block;height:170px;margin:14px 0 0 36px;border-bottom:1px solid var(--neutral-300)}
  .lc .hit{position:absolute;inset:0;display:flex}
  .lc .hit .cg{height:100%}
  .lc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .lc .gl{position:absolute;left:0;right:0;border-top:1px solid var(--neutral-100);pointer-events:none}
  .lc .yl{position:absolute;left:-36px;width:30px;text-align:right;font-size:11px;color:var(--muted);transform:translateY(-50%);pointer-events:none}
  .lc .pt{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 2px #fff}
  .lc .pt.out{background:var(--out-line)} .lc .pt.in{background:#fff;border:2px solid var(--in-line)}
  .lc+.axis{margin-left:36px}
  .vt{display:inline-flex;min-width:0;flex:none} .vt button{padding:6px 12px;font-size:13px}
  .hb{padding:8px 0} .hb+.hb{border-top:1px solid var(--line)}
  .hbr{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px}
  .hbr i{display:block;height:10px;border-radius:0 4px 4px 0;min-width:2px}
  .hbr span{flex:none;color:var(--ink)}
  .cg{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:default}
  .cg .bars{display:flex;align-items:flex-end;gap:2px;height:150px;width:100%;justify-content:center}
  .cg .bars i{display:block;width:min(14px,44%);border-radius:4px 4px 0 0}
  .cg:hover{background:var(--neutral-50)}
  .axis{display:flex;gap:3px;margin-top:4px}
  .axis span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:visible}
  .rk{display:flex;align-items:center;gap:10px;padding:8px 0}
  .rk+.rk{border-top:1px solid var(--line)}
  .rk .no{width:28px;height:28px;border-radius:var(--r-pill);background:var(--neutral-100);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
  .rk .no.top{background:var(--accent);color:#fff}
  .rk .bar i{background:var(--brand)}
  .rk .bar{margin:4px 0 0}
  .tip{position:fixed;z-index:700;background:var(--neutral-900);color:var(--neutral-50);font-size:12px;padding:6px 10px;border-radius:var(--r-md);pointer-events:none;white-space:nowrap}
  .pnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  details summary{cursor:pointer;color:var(--swu-700);font-size:13px;margin-top:10px}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid var(--line)}
  td.n,th.n{text-align:right}
  .line.ok{border:2px solid var(--green-600);background:var(--green-50)}
  .line.bad{border:2px solid var(--red-600);background:var(--red-50)}
  .line.user{border:2px solid var(--brand-600)}
  input.fok{border:2px solid var(--green-600)}
  input.fbad{border:2px solid var(--red-600);background:var(--red-50)}
  .dthumb img{object-fit:contain;background:var(--neutral-100)}
  .dthumb .tag{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:var(--r-sm);background:rgba(23,23,23,.65);color:var(--neutral-50)}
  .dthumb .dd{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:var(--r-pill);background:var(--green-800);color:var(--neutral-50);display:grid;place-items:center}
  .dthumb .dd svg{width:12px;height:12px}
  .ph .x.cr{right:32px}
  .scanbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=range]{accent-color:var(--accent)}
  table.lt{min-width:900px}
  .lt td{vertical-align:top;padding:8px 6px}
  .lt th{white-space:nowrap}
  .lt input,.lt select{height:34px;font-size:13px;padding:0 8px}
  .lt td.no{width:92px;white-space:nowrap}
  .lt td .stc{display:flex;gap:4px;flex-wrap:wrap}
  .lt tr.ln td{border-top:2px solid transparent;border-bottom:2px solid transparent}
  .lt tr.ln.ok td{background:var(--green-50);border-color:var(--green-600)}
  .lt tr.ln.bad td{background:var(--red-50);border-color:var(--red-600)}
  .lt tr.ln.user td{border-color:var(--brand-600)}
  .lt tr.ln td:first-child{border-left:2px solid transparent}
  .lt tr.ln td:last-child{border-right:2px solid transparent}
  .lt tr.ln.ok td:first-child,.lt tr.ln.ok td:last-child{border-left-color:var(--green-600);border-right-color:var(--green-600)}
  .lt tr.ln.bad td:first-child,.lt tr.ln.bad td:last-child{border-left-color:var(--red-600);border-right-color:var(--red-600)}
  .lt tr.ln.user td:first-child,.lt tr.ln.user td:last-child{border-left-color:var(--brand-600);border-right-color:var(--brand-600)}
  main.wrap{padding-bottom:8px}
  .site-foot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 16px;margin-top:24px;padding:24px 16px 36px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.6;text-align:left}
  .site-foot b{color:var(--text)}

  .login .lgp i{height:46px}

  .brandrow .lgp{gap:10px;padding-right:16px;border-right:1px solid var(--neutral-200)}
  .top .lgp i{height:36px}
  .login .logo{justify-content:center;text-align:center}
  @media(max-width:600px){.brandrow{gap:10px}.brandrow .lgp{gap:6px;padding-right:10px}.top .lgp i{height:26px}.top .logo span{display:none}}
  body:has(.bnav) .site-foot{padding-bottom:100px}
  @media print{.site-foot{display:none}}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--neutral-200);padding-bottom:env(safe-area-inset-bottom)}
  .bnav .in{display:flex;max-width:680px;margin:0 auto}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:8px 2px 6px;color:var(--muted);font-size:12px;font-weight:400;transition:150ms cubic-bezier(.2,.7,.2,1)}
  .bnav button svg{width:26px;height:26px}
  .bnav button:hover{background:var(--neutral-50);color:var(--swu-700)}
  .bnav button.on{color:var(--swu-700);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
  .bnav button:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--focus-ring)}
  .top-who{text-align:right;line-height:1.35;color:var(--muted)}
  .hide-m{font-style:normal}
  @media(max-width:600px){.top-who,.hide-m{display:none}.logo b{font-size:15px}}
  .demo-acc{display:flex;align-items:center;gap:10px;text-align:left}
  .demo-acc .th{width:40px;height:40px}
  .demo-acc .th svg{width:20px;height:20px}
  .reg-cta{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border-top:1px solid var(--line);padding-top:14px}
  .ic-btn{width:32px;padding:0}
  .ic-btn svg{width:18px;height:18px}
  .rdots{display:flex;align-items:center;gap:8px;margin:10px 0 14px;font-size:13px;color:var(--muted)}
  .rdots span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .rdots b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--neutral-100);font-size:12px}
  .rdots .on{color:var(--text);font-weight:700}
  .rdots .on b{background:var(--accent);color:#fff}
  .rdots .done b{background:var(--swu-100);color:var(--swu-700)}
  .rdots i{flex:1;height:2px;background:var(--neutral-200)}
  .rcard{display:flex;gap:12px;align-items:flex-start;padding:14px}
  .rcard:disabled{opacity:.55;cursor:not-allowed}
  .rcard:disabled:hover{box-shadow:none;transform:none}
  .sw{position:relative;width:44px;height:26px;border-radius:var(--r-pill);background:var(--neutral-300);transition:150ms cubic-bezier(.2,.7,.2,1);flex:none;display:inline-block;vertical-align:middle}
  .sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(23,23,23,.25);transition:150ms cubic-bezier(.2,.7,.2,1)}
  .sw.on{background:var(--accent)}
  .sw.on::after{left:21px}
  .sw:disabled{opacity:.5}
  .sw:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring)}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  table.ut{min-width:720px}
  .ut td{vertical-align:top;padding:8px}
  table.pm{min-width:640px}
  .pm th,.pm td{text-align:center;vertical-align:middle;padding:8px}
  .pm th:first-child,.pm td:first-child{text-align:left}
  .pmd{white-space:normal;max-width:300px;font-weight:400}
  .role-off{border-color:var(--red-600)}
  .m-only{display:none}
  @media(max-width:640px){.m-only{display:inline-flex}.ut td.d-only{display:none}}
  .pm-m{display:none}
  .pm-m .grp+.grp{margin-top:14px}
  .pm-m .it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
  @media(max-width:640px){
    table.ut{min-width:0}
    .ut thead{display:none}
    .ut,.ut tbody,.ut tr,.ut td{display:block}
    .ut tr{border:1px solid var(--neutral-200);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:8px}
    .ut td{border:0;padding:2px 0}
    .ut td[data-l]::before{content:attr(data-l) ' · ';color:var(--muted);font-size:12px}
    .ut .acts{margin-top:6px}
    .pm-d{display:none}
    .pm-m{display:block}
  }
  .pw-box{font-size:24px;font-weight:700;letter-spacing:.08em;text-align:center;background:var(--neutral-100);border-radius:var(--r-md);padding:14px;margin:12px 0}
  .mono{font-family:ui-monospace,Consolas,monospace}
</style>

function readImg(file, max) {
  return new Promise(function (ok, bad) {
    if (['image/jpeg', 'image/png', 'image/webp'].indexOf(file.type) < 0) return bad(new Error('รองรับเฉพาะรูป JPG / PNG / WebP'));
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.72));
      };
      im.onerror = function () { bad(new Error('อ่านรูปไม่ได้')); };
      im.src = fr.result;
    };
    fr.onerror = function () { bad(new Error('อ่านไฟล์ไม่ได้')); };
    fr.readAsDataURL(file);
  });
}

      if (x.status === 'pending') { log(name, 'pending', x); save(); throw new Error('บัญชีนี้รอผู้ดูแลระบบอนุมัติ — กรุณารอการอนุมัติแล้วลองใหม่'); }
      if (x.status === 'rejected') { log(name, 'rejected', x); save(); throw new Error('คำขอลงทะเบียนนี้ไม่ได้รับการอนุมัติ — ติดต่อผู้ดูแลระบบ'); }
      if (x.status !== 'active') { log(name, 'disabled', x); save(); throw new Error('บัญชีนี้ถูกระงับ — ติดต่อผู้ดูแลระบบ'); }
      if (!can(x.role, 'portal')) { log(name, 'closed', x); save(); throw new Error('ระบบสำหรับตำแหน่ง' + ROLE_NAME[x.role] + 'ถูกปิดชั่วคราว — ติดต่อผู้ดูแลระบบ'); }
      var tok = session(x); x.lastLogin = nowStr(); log(name, 'ok', x); save();
      return { token: tok, role: x.role, name: x.displayName, user: x.username, mustChange: x.mustChange };
    },
    apiLogout: function (tok) { var s = db.ses[tok]; delete db.ses[tok]; if (s) log(s.user, 'logout', findU(s.user)); save(); return true; },
    apiRegInfo: function () { var o = seat(); o.codeRequired = false; return o; },
    apiRegister: function (p) {
      p = p || {};
      var role = String(p.role || ''), username = String(p.username || '').trim().toLowerCase(), displayName = String(p.displayName || '').trim().slice(0, 80), phone = phoneNorm(p.phone, true);
      if (REG_ROLES.indexOf(role) < 0) throw new Error('กรุณาเลือกตำแหน่ง');
      validateNew(username, displayName); chkPw(p.password, username, [displayName, phone]); checkSlot(role);
      db.users.push({ username: username, displayName: displayName, role: role, status: 'pending', phone: phone, password: String(p.password), ver: 1, mustChange: false, createdAt: nowStr(), createdBy: 'self-register', reviewedAt: '', reviewedBy: '', lastLogin: '' });
      save(); return true;
    },
    apiListUsers: function (tok) { who(tok, ['admin']); return { users: db.users.map(pub), limits: seat() }; },
    apiCreateUser: function (tok, p) {
      var s = who(tok, ['admin']); p = p || {};
      var role = String(p.role || ''), username = String(p.username || '').trim().toLowerCase(), displayName = String(p.displayName || '').trim().slice(0, 80);
      if (REG_ROLES.indexOf(role) < 0) throw new Error('กรุณาเลือกตำแหน่ง');
      validateNew(username, displayName); checkSlot(role);
      var t = temp();
      db.users.push({ username: username, displayName: displayName, role: role, status: 'active', phone: phoneNorm(p.phone, false), password: t, ver: 1, mustChange: true, createdAt: nowStr(), createdBy: s.user, reviewedAt: nowStr(), reviewedBy: s.user, lastLogin: '' });
      save(); return { username: username, tempPassword: t };
    },
    apiReviewUser: function (tok, u, dec) {
      var s = who(tok, ['admin']), m = manageable(mustU(u));
      if (m.status !== 'pending' && m.status !== 'rejected') throw new Error('บัญชีนี้ไม่ได้อยู่ในสถานะรออนุมัติ');
      if (dec !== 'approve' && dec !== 'reject') throw new Error('คำสั่งไม่ถูกต้อง');
      if (dec === 'approve' && m.status === 'rejected') checkSlot(m.role);
      m.status = dec === 'approve' ? 'active' : 'rejected'; m.reviewedAt = nowStr(); m.reviewedBy = s.user; save(); return true;
    },
    apiSetUserStatus: function (tok, u, st) {
      var s = who(tok, ['admin']), m = manageable(mustU(u));
      if (st === 'disabled' && m.status === 'active') m.status = 'disabled';
      else if (st === 'active' && m.status === 'disabled') m.status = 'active';
      else throw new Error('เปลี่ยนสถานะไม่ได้');
      m.reviewedAt = nowStr(); m.reviewedBy = s.user; save(); return true;
    },
    apiResetUserPassword: function (tok, u) { who(tok, ['admin']); var m = manageable(mustU(u)), t = temp(); m.password = t; m.ver++; m.mustChange = true; save(); return { username: m.username, tempPassword: t }; },
    apiDeleteUser: function (tok, u) { who(tok, ['admin']); var m = manageable(mustU(u)); if (m.status === 'active') throw new Error('ต้องระงับบัญชีก่อนจึงจะลบได้'); db.users = db.users.filter(function (x) { return x !== m; }); save(); return true; },
    apiSaveUser: function (tok, p) {
      who(tok, ['admin']); p = p || {};
      var m = manageable(mustU(p.username)), nm = String(p.displayName || '').trim().slice(0, 80);
      if (!nm) throw new Error('กรุณากรอกชื่อ-นามสกุล');
      m.displayName = nm; m.phone = phoneNorm(p.phone, false); save(); return true;
    },
    apiChangePassword: function (tok, o, n) {
      var s = who(tok, null, true), m = mustU(s.user);
      if (o !== m.password) throw new Error('รหัสผ่านเดิมไม่ถูกต้อง');
      chkPw(n, m.username, [m.displayName, m.phone]);
      if (n === o) throw new Error('รหัสผ่านใหม่ต้องต่างจากรหัสเดิม');
      m.password = String(n); m.ver++; m.mustChange = false; delete db.ses[tok];
      var t = session(m); save(); return { token: t };
    },
    apiListLoginLogs: function (tok) { who(tok, ['admin']); return clone(db.logs.slice(0, 200)); },
    apiListPerms: function (tok) { who(tok, ['admin']); return { perms: perms(), log: clone(db.plog.slice().reverse().slice(0, 20)) }; },
    apiSetPermission: function (tok, role, key, value) {
      var s = who(tok, ['admin']), d = PERM_DEFS.filter(function (x) { return x.key === key; })[0];
      if (!d || d.roles.indexOf(role) < 0) throw new Error('ไม่มีสิทธิ์นี้ในบทบาทที่เลือก');
      db.perms[role] = db.perms[role] || {}; db.perms[role][key] = !!value;
      db.plog.push({ time: nowStr(), by: s.user, role: role, key: key, value: !!value }); save(); return { perms: perms() };
    },
    apiResetPerms: function (tok) { var s = who(tok, ['admin']); db.perms = {}; db.plog.push({ time: nowStr(), by: s.user, role: 'all', key: 'reset', value: true }); save(); return { perms: perms() }; },
    apiStockData: function (tok) { return view(who(tok)); },
    apiStockHistory: function (tok, p) {
      who(tok);
      var m = String(p && p.month || ''), months = {};
      if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)) throw new Error('เดือนไม่ถูกต้อง');
      db.txs.forEach(function (t) { if (t.d) months[t.d.slice(0, 7)] = 1; });
      return clone({ month: m, txs: db.txs.filter(function (t) { return t.d.slice(0, 7) === m; }).reverse(), months: Object.keys(months).sort().reverse() });
    },
    apiStockPhotos: function (tok, p) { who(tok); var o = {}; (p.ids || []).forEach(function (id) { if (String(id).indexOf('data:') === 0) o[id] = id; }); return o; },
    apiStockAddItem: function (tok, p) {
      var s = mgr(tok, 'เพิ่มวัสดุ', 'item'), v = checkItem(p);
      db.items.push({ id: 'I' + Date.now(), name: v.name, cat: v.cat, unit: v.unit, min: v.min, qty: 0, img: v.img }); save(); return view(s);
    },
    apiStockUpdateItem: function (tok, p) {
      var s = mgr(tok, 'แก้ไขวัสดุ', 'item'), v = checkItem(p), it = db.items.filter(function (x) { return x.id === p.id; })[0];
      if (!it) throw new Error('ไม่พบวัสดุ');
      it.name = v.name; it.cat = v.cat; it.unit = v.unit; it.min = v.min; if (v.img) it.img = v.img; save(); return view(s);
    },
    apiStockReceive: function (tok, p) {
      var s = mgr(tok, 'รับวัสดุเข้า', 'receive'), v = checkReceive(p), t = stamp();
      var lines = v.lines.map(function (l) {
        var it = db.items.filter(function (x) { return x.id === l.itemId; })[0];
        if (!it) { if (!l.unit) throw new Error('กรุณากรอกหน่วยนับของวัสดุใหม่ "' + l.name + '"'); it = { id: 'I' + Date.now() + Math.floor(Math.random() * 1000), name: l.name, cat: l.cat, unit: l.unit, min: 0, qty: 0, img: '' }; db.items.push(it); }
        it.qty = Math.round((it.qty + l.qty) * 100) / 100;
        return { itemId: it.id, name: it.name, unit: it.unit, qty: l.qty, docQty: l.docQty };
      });
      db.txs.push({ id: 'T' + (++db.n), type: 'in', d: t.d, at: t.at, by: s.name, area: '', supplier: v.supplier, docNo: v.docNo, docDate: v.date, note: v.note, photos: p.photos.slice(0, 10), docImgs: (p.docs || []).slice(0, 6), lines: lines });
      save(); return view(s);
    },
    apiStockIssue: function (tok, p) {
      var s = who(tok);
      if (s.role !== 'staff' && s.role !== 'lead') throw new Error('เฉพาะเจ้าหน้าที่ปฏิบัติงานและหัวหน้างานเท่านั้นที่เบิกวัสดุจากสต็อกได้');
      need(s, 'issue');
      var v = checkIssue(p), t = stamp();
      var lines = v.lines.map(function (l) {
        var it = db.items.filter(function (x) { return x.id === l.itemId; })[0];
        if (!it) throw new Error('มีรายการที่ยังไม่ได้เลือกวัสดุ');
        if (l.qty > it.qty) throw new Error('สต็อก ' + it.name + ' เหลือ ' + it.qty + ' ไม่พอเบิก ' + l.qty);
        return { it: it, qty: l.qty };
      });
      lines.forEach(function (l) { l.it.qty = Math.round((l.it.qty - l.qty) * 100) / 100; });
      db.txs.push({ id: 'T' + (++db.n), type: 'out', d: t.d, at: t.at, by: s.name, area: v.area, supplier: '', docNo: '', docDate: '', note: v.note, photos: p.photos.slice(0, 10), docImgs: [],
        lines: lines.map(function (l) { return { itemId: l.it.id, name: l.it.name, unit: l.it.unit, qty: l.qty, docQty: null }; }) });
      save(); return view(s);
    },
    apiStockScan: function (tok, p) {
      mgr(tok, 'อ่านใบส่งของ', 'ai');
      return { demo: true, supplier: 'หจก. ช่างไทยวัสดุ (ทดลอง)', docNo: 'IV7001', date: TODAY, unclear: ['docNo'], lines: [
        { row: '1', name: 'หลอดไฟ LED T8 18W', qty: 24, unit: 'หลอด', legible: true },
        { row: '2', name: 'เทปพันเกลียว', qty: 20, unit: 'ม้วน', legible: true },
        { row: '3', name: 'ถุงมือผ้าเคลือบยาง', qty: 50, unit: 'คู่', legible: false },
        { row: '4', name: 'กาวยาแนวกระเบื้อง', qty: 6, unit: 'ถุง', legible: true }] };
    }
  };
  var DEMO = ['admin', 'staff', 'lead', 'store', 'viewer'];
  return {
    call: function (name) {
      var args = Array.prototype.slice.call(arguments, 1);
      try { var fresh = JSON.parse(localStorage.getItem(KEY) || 'null'); if (fresh && fresh.items && fresh.users) db = fresh; } catch (e) {}
      return new Promise(function (res) {
        setTimeout(function () {
          try { if (!F[name]) throw new Error('ไม่มีฟังก์ชัน ' + name); res({ ok: true, data: F[name].apply(null, args) }); }
          catch (e) { res({ ok: false, error: e.message }); }
        }, 120);
      });
    },
    loginCards: function () {
      return '<div class="card gap"><h3>บัญชีทดลอง</h3><div class="muted xs">แตะเพื่อเข้าสู่ระบบตามบทบาท (รหัสผ่าน ' + PW + ') · ลองลงทะเบียนบัญชีใหม่ แล้วเข้าเป็น admin เพื่ออนุมัติได้</div>' + DEMO.map(function (u) {
        var x = findU(u) || { role: u };
        return '<button class="btn block demo-acc" style="justify-content:flex-start;height:auto;padding:10px 12px" data-act="demologin" data-u="' + u + '"><span class="th">' + ROLE_IC[x.role] + '</span><span><b>' + esc(ROLE_NAME[x.role]) + '</b><br><span class="muted xs" style="font-weight:400">' + esc(u) + '</span></span></button>';
      }).join('') + '<button class="btn ghost danger sm" data-act="mockreset">ล้างข้อมูลจำลองแล้วเริ่มใหม่</button></div>';
    },
    reset: function () { db = seed(); save(); }
  };
})();
/* mockup.html?embed=1&role=admin|staff|lead|store|viewer&tab=stock|dash|in|out|hist|admin — present.html ฝังหน้านี้ใน iframe แล้วเข้าสู่ระบบตามบทบาทให้เลย */
function devAuto() {
  var q = {}; location.search.replace(/^\?/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ''); });
  if (q.role === 'home' || !q.role) return q.embed === '1' ? (render(), true) : false;
  if (['admin', 'staff', 'lead', 'store', 'viewer'].indexOf(q.role) < 0) return false;
  MOCK.call('apiLogin', q.role, 'demo1234').then(function (r) {
    if (!r.ok) return render();
    enter(r.data); ssSet('pem_ses', '');
    if (q.tab) { S.tab = q.tab; render(); }
  });
  return true;
}
function demoLogin(u) { document.getElementById('lu').value = u; document.getElementById('lp').value = 'demo1234'; doLogin(); }
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-act="mockreset"],[data-act="demologin"]'); if (!el) return;
  if (el.getAttribute('data-act') === 'demologin') demoLogin(el.getAttribute('data-u'));
  else { MOCK.reset(); toast('สร้างข้อมูลจำลองใหม่แล้ว'); }
});
/* @dev:end */

(function init() {
  var ses = null;
  if (typeof devAuto === 'function' && devAuto()) return;
  try { ses = JSON.parse(ssGet('pem_ses') || 'null'); } catch (e) { ses = null; }
  if (ses && ses.token) enter(ses); else render();
})();
</script>
